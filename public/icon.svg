<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="50%" stop-color="#0c0d14"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base with Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#shadow)" opacity="0.18"/>

  <!-- Central Emblem: Stylized Play Button intersecting with Scissors / Lightning Cut -->
  <g filter="url(#shadow)">
    <!-- Play Triangle -->
    <path d="M 200 150 L 370 256 L 200 362 Z" fill="url(#primaryGrad)"/>

    <!-- Cut Notch (Representing precision AI clipping) -->
    <path d="M 170 210 L 320 256 L 170 302" fill="none" stroke="#0c0d14" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- AI Sparkle / Star at the tip -->
    <path d="M 390 190 Q 405 190 405 175 Q 405 190 420 190 Q 405 190 405 205 Q 405 190 390 190 Z" fill="#38bdf8"/>
    <circle cx="160" cy="180" r="12" fill="#ec4899"/>
    <circle cx="160" cy="332" r="12" fill="#a855f7"/>
  </g>
</svg>
